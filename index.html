<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>Mini project To-Do List</h1>
            <p>Manage your daily tasks easily</p>
        </header>

        <!-- Add Task Section -->
        <div class="task-input">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addTaskBtn">Add Task</button>
        </div>

        <!-- Error Message -->
        <p id="errorMessage"></p>

        <!-- Task Statistics -->
        <div class="task-info">
            <p>Total Tasks: <span id="taskCount">0</span></p>

            <p>Completed: <span id="completedCount">0</span></p>
        </div>

        <!-- Task List -->
        <div class="task-container">

            <h2>My Tasks</h2>

            <ul id="taskList">
                <!-- Tasks will be added here using JavaScript -->
            </ul>

            <!-- Message when there are no tasks -->
            <p id="emptyMessage">No tasks yet. Add a task to get started!</p>

        </div>

    </div>

    <!-- JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
